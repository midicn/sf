name: Deploy sf site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 只装配**要给访问者的文件**（与 lib / mid / zip 同一纪律）：
      #    不把 tools/ 与仓库元文件暴露成线上路径。
      #    站点是**纯静态**的 —— 页面只读 data/*.json，运行时不调用任何第三方接口。
      - name: Assemble site
        run: |
          set -e
          mkdir -p _build
          cp index.html 404.html manifest.json robots.txt sitemap.xml _build/
          cp -r assets _build/assets
          cp -r data  _build/data
          # ⚠️ **显式复制清单**：新增站点文件/目录必须在这里登记，否则线上 404
          #    （专区页就因此漏过一次）。下面还有一步专门断言它们真的在产物里。
          cp -r f1     _build/f1
          cp -r f2     _build/f2
          cp -r ethnic _build/ethnic

          # 自检：页面要的数据文件必须在，且 F1 托管清单不能为空
          test -f _build/data/soundfonts.json || { echo "::error::data/soundfonts.json 缺失"; exit 1; }
          test -f _build/data/hosted.json     || { echo "::error::data/hosted.json 缺失（先跑 tools/host_f1.py）"; exit 1; }
          test -f _build/f1/index.html        || { echo "::error::f1/index.html 未登记进装配清单"; exit 1; }
          test -f _build/f2/index.html        || { echo "::error::f2/index.html 未登记进装配清单"; exit 1; }
          test -f _build/ethnic/index.html    || { echo "::error::ethnic/index.html 未登记进装配清单"; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open('_build/data/soundfonts.json', encoding='utf-8'))
          h = json.load(open('_build/data/hosted.json',   encoding='utf-8'))
          t = d['totals']
          assert t['redist'] == len(d['entries']), '目录条数与可分发数不一致'
          assert all(e['t'] in ('F1','F2','F3') for e in d['entries']), '目录里出现 F4 条目'
          bad = [e['i'] for e in d['entries'] if e['t'] == 'F3' and e.get('d')]
          assert not bad, 'F3 条目带了下载直链'
          assert h['files'], '托管清单为空'
          print('台账 %s 条 · 目录 %d · 托管 %d' % (t['all'], len(d['entries']), len(h['files'])))
          PY

      # ── 音色文件：从 Release 拉进产物，由本站源提供 ────────────────────
      # 为什么绕这一道：**GitHub Release 资产不带 `Access-Control-Allow-Origin`**，
      # 浏览器 fetch 不到 → 音乐库那条「选音色即播」的路就走不通。
      # 本站（GitHub Pages）带 `ACAO: *` 且境内可达，所以把字节放到站点源上，
      # Release 只当**字节源 + 直下镜像**（与 lib 站「从 Release 装配」同一模式）。
      - name: Fetch hosted soundfonts from Release
        run: |
          set -e
          python3 - <<'PY'
          import json, os, hashlib, subprocess, sys
          hd = json.load(open('data/hosted.json', encoding='utf-8'))
          out = '_build/files'
          os.makedirs(out, exist_ok=True)
          bad = []
          for i, (uid, v) in enumerate(hd['files'].items(), 1):
              dst = os.path.join(out, v['file'])
              url = v.get('release') or v['url']
              r = subprocess.run(['curl', '-sSL', '--retry', '4', '--retry-delay', '5',
                                  '--retry-all-errors', '-o', dst, url])
              if r.returncode != 0 or not os.path.exists(dst):
                  bad.append((v['file'], '下载失败')); continue
              n = os.path.getsize(dst)
              h = hashlib.sha256(open(dst, 'rb').read()).hexdigest()
              if n != v['bytes'] or h != v['sha256']:
                  bad.append((v['file'], '校验不符 %s/%s vs %s/%s' % (n, h[:12], v['bytes'], v['sha256'][:12])))
              if i % 10 == 0 or i == len(hd['files']):
                  print('  %d/%d' % (i, len(hd['files'])), flush=True)
          if bad:
              for f, why in bad[:10]:
                  print('::error::%s %s' % (f, why))
              sys.exit('音色文件装配失败：%d 个（字节源 %s）' % (len(bad), hd.get('release_tag')))
          total = sum(v['bytes'] for v in hd['files'].values())
          print('装配 %d 个音色 · %.1f MB · sha256 全部一致' % (len(hd['files']), total / 1048576))
          PY
          ls _build/files | head -5
          du -sh _build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
